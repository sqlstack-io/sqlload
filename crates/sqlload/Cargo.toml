[package]
name = "sqlload"
version.workspace = true
description = "SQL data loading tooling. Pre-release, under development."
edition.workspace = true
license.workspace = true
publish = true
readme = "README.md"
# Integration tests need the unpublished testkit.
exclude = ["tests/"]
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sqlload"
path = "src/main.rs"
required-features = ["cli"]
# The library and the executable share a name; document only the library.
doc = false

[features]
default = ["cli", "duckdb"]
# The `sqlload` executable and its command-line parsing.
cli = ["dep:clap", "dep:rlimit", "dep:tracing-subscriber"]
# TLS and SASL support in the bundled librdkafka.
ssl = ["rdkafka/ssl"]
# TLS with OpenSSL built in, so the binary needs no system OpenSSL (PyPI wheels).
ssl-vendored = ["rdkafka/ssl-vendored"]
sasl = ["rdkafka/sasl"]
# Select the Docker-backed integration tests (`make test-containers`).
container-tests = []
# DuckDB as a loader destination, compiled from the bundled source (cached in CI after the first build).
duckdb = ["dep:duckdb"]

[dependencies]
aes.workspace = true
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-cast.workspace = true
arrow-csv.workspace = true
arrow-ipc.workspace = true
arrow-ord.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
async-compression.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap = { workspace = true, optional = true }
csv-core.workspace = true
duckdb = { workspace = true, optional = true }
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
globset.workspace = true
hex.workspace = true
hmac.workspace = true
humantime.workspace = true
jsonwebtoken.workspace = true
object_store.workspace = true
parquet.workspace = true
prometheus-client.workspace = true
regex.workspace = true
rdkafka.workspace = true
reqwest.workspace = true
rlimit = { workspace = true, optional = true }
rsa.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
pgwire-replication.workspace = true
prost.workspace = true
tokio-postgres.workspace = true
tokio-rustls.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tonic.workspace = true
tonic-prost.workspace = true
toml.workspace = true
toml_edit.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true
webpki-roots.workspace = true
zstd.workspace = true

[dev-dependencies]
bytes.workspace = true
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-cast.workspace = true
serde_json.workspace = true
sqlload-testkit.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[lints]
workspace = true

[[test]]
name = "exporter"
path = "tests/exporter.rs"
required-features = ["container-tests"]

[[test]]
name = "adapters"
path = "tests/adapters.rs"
required-features = ["container-tests"]

[[test]]
name = "loader"
path = "tests/loader.rs"
required-features = ["container-tests", "duckdb"]
