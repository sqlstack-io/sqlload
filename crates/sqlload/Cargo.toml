[package]
name = "sqlload"
version.workspace = true
description = "SQL data loading tooling. Pre-release, under development."
edition.workspace = true
license.workspace = true
publish = true
readme = "README.md"
# Integration tests need the unpublished testkit.
exclude = ["tests/"]
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sqlload"
path = "src/main.rs"
required-features = ["cli"]
# The library and the executable share a name; document only the library.
doc = false

[features]
default = ["cli"]
# The `sqlload` executable and its command-line parsing.
cli = ["dep:clap", "dep:rlimit", "dep:tracing-subscriber"]
# TLS and SASL support in the bundled librdkafka.
ssl = ["rdkafka/ssl"]
# TLS with OpenSSL built in, so the binary needs no system OpenSSL (PyPI wheels).
ssl-vendored = ["rdkafka/ssl-vendored"]
sasl = ["rdkafka/sasl"]
# Select the Docker-backed integration tests (`make test-containers`).
container-tests = []

[dependencies]
aes.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap = { workspace = true, optional = true }
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
globset.workspace = true
hex.workspace = true
hmac.workspace = true
humantime.workspace = true
jsonwebtoken.workspace = true
parquet.workspace = true
prometheus-client.workspace = true
regex.workspace = true
rdkafka.workspace = true
reqwest.workspace = true
rlimit = { workspace = true, optional = true }
rsa.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
sqlload-testkit.workspace = true
tokio.workspace = true
tokio-util.workspace = true



[lints]
workspace = true

[[test]]
name = "exporter"
path = "tests/exporter.rs"
required-features = ["container-tests"]
