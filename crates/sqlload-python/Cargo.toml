[package]
name = "sqlload-python"
version.workspace = true
description = "The native module of the sqlload Python package: the command line in-process, with the Python host of sqlload-python-host."
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[lib]
name = "sqlload_python"
crate-type = ["cdylib", "rlib"]
# Tested from Python (packages/sqlload/tests); a Rust test binary would have to link libpython.
test = false
doctest = false

[features]
# TLS with OpenSSL built in, as in the sqlload-cli wheels.
ssl-vendored = ["sqlload/ssl-vendored", "sqlload-python-host/ssl-vendored"]
# ODBC sources, as in the sqlload-cli wheels.
odbc = ["sqlload/odbc", "sqlload-python-host/odbc"]

[dependencies]
arrow-array.workspace = true
arrow-pyarrow.workspace = true
arrow-schema.workspace = true
base64.workspace = true
chrono-tz.workspace = true
pyo3.workspace = true
serde_json.workspace = true
sqlload = { workspace = true, default-features = true }
sqlload-python-host.workspace = true
tracing.workspace = true

[lints]
workspace = true
