[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sqlload"
version = "0.3.0" # x-release-please-version
description = "SQL data loading tooling. Pre-release, under development."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database",
]
dependencies = [
  "sqlload-cli==0.3.0", # x-release-please-version
]

[project.urls]
Homepage = "https://github.com/sqlstack-io/sqlload"
Issues = "https://github.com/sqlstack-io/sqlload/issues"
Repository = "https://github.com/sqlstack-io/sqlload"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlload"]

[tool.uv.sources]
sqlload-cli = { path = "packages/sqlload-cli" }
