[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sqlload"
version = "0.0.1" # x-release-please-version
description = "Export Kafka topics to Snowflake: Snowpipe Streaming, internal stages or your own S3 bucket"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["kafka", "snowflake", "snowpipe", "s3", "etl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database",
]
dependencies = [
  "sqlload-cli==0.0.1", # x-release-please-version
]

[project.urls]
Homepage = "https://github.com/sqlstack-io/sqlload"
Issues = "https://github.com/sqlstack-io/sqlload/issues"
Repository = "https://github.com/sqlstack-io/sqlload"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlload"]

[tool.uv.sources]
sqlload-cli = { path = "packages/sqlload-cli" }
