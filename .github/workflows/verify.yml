name: Verify

on:
  pull_request:
  # Runs on main too, so main holds the dependency cache (DuckDB's C++ build included) that
  # every pull request restores; caches saved by a pull request are visible only to that PR.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify verification scope
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pull requests touching only documentation skip the build and test jobs; everything
      # else, and manual runs, verify in full.
      - name: Select relevant jobs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          code=false
          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "${path}" in
              docs/*|website/*|*.md|LICENSE|.gitignore)
                ;;
              *)
                code=true
                ;;
            esac
          done < <(git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}")
          if [[ "${changed}" != "true" ]]; then
            code=true
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  checks:
    name: Checks and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # A cold cache compiles DuckDB from source (about 25 minutes); warm runs take a few.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - run: make check-ci
      - run: make test-unit
      # Builds the sqlload extension (crates/sqlload-python) in the same target directory, so the
      # rust-cache above covers it, and runs the Python package's tests.
      - run: make test-python
      - name: Package the crate as crates.io would
        run: cargo publish --dry-run --locked -p sqlload

  containers:
    name: Container tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # A cold cache compiles DuckDB from source (about 25 minutes); warm runs take a few.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: containers
      - run: |
          docker pull redpandadata/redpanda:v25.1.4
          docker pull postgres:17-alpine
          docker pull chrislusf/seaweedfs:3.97
      - run: make test-containers

  verify:
    name: Verify
    if: always()
    needs: [changes, checks, containers]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm every required job passed or was skipped for a docs-only change
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "Scope classification: ${CHANGES_RESULT}" >&2
            exit 1
          fi
          for result in "${CHECKS_RESULT}" "${CONTAINERS_RESULT}"; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "A verification job ended with ${result}" >&2
                exit 1
                ;;
            esac
          done
