name: Published wheel smoke test

# When a release is published, wait until PyPI serves it, then install it on every platform the
# wheels are built for and check it runs: the CLI, the import, a small load and the ODBC driver
# manager. Release Please creates the release with the delivery app token, so the event fires (one
# GITHUB_TOKEN made would not). Not a required check; it uses no release secrets.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test, for example 0.66.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Wait for PyPI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-${TAG#v}}"
          if [[ ! "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing version '$version'. Expected 0.MINOR.PATCH."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Publish builds the wheels after the release is created, which takes up to about 90 minutes,
      # then uploads them one by one. Wait until pip's index (which lags the JSON API by minutes)
      # lists every platform's wheel and the sdist of both packages: 180 attempts a minute apart.
      - name: Wait until PyPI's index lists every wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="macosx_11_0_arm64.whl macosx_11_0_x86_64.whl manylinux_2_28_aarch64.whl manylinux_2_28_x86_64.whl win_amd64.whl"
          for package in sqlload sqlload-cli; do
            prefix="${package//-/_}-${VERSION}-"
            for attempt in $(seq 1 180); do
              listed=$(curl -fsS -H "Accept: application/vnd.pypi.simple.v1+json" "https://pypi.org/simple/${package}/" | jq -r '.files[].filename' || true)
              missing=""
              for suffix in $expected; do
                grep -q "^${prefix}.*${suffix}$" <<< "$listed" || missing="$missing $suffix"
              done
              grep -qx "${package//-/_}-${VERSION}.tar.gz" <<< "$listed" || missing="$missing sdist"
              if [ -z "$missing" ]; then
                echo "PyPI's index lists every file of ${package} ${VERSION} (attempt ${attempt})"
                continue 2
              fi
              echo "attempt ${attempt}: ${package} ${VERSION} still lacks:${missing}"
              sleep 60
            done
            echo "PyPI's index still lacks files of ${package} ${VERSION} after 180 attempts"
            exit 1
          done
          # sqlload-api is pure Python: one wheel for every platform, and its sdist.
          for attempt in $(seq 1 180); do
            listed=$(curl -fsS -H "Accept: application/vnd.pypi.simple.v1+json" "https://pypi.org/simple/sqlload-api/" | jq -r '.files[].filename' || true)
            if grep -qx "sqlload_api-${VERSION}-py3-none-any.whl" <<< "$listed" && grep -qx "sqlload_api-${VERSION}.tar.gz" <<< "$listed"; then
              echo "PyPI's index lists sqlload-api ${VERSION} (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: sqlload-api ${VERSION} is not listed yet"
            sleep 60
          done
          echo "PyPI's index still lacks sqlload-api ${VERSION} after 180 attempts"
          exit 1

  smoke:
    name: Smoke (${{ matrix.platform.name }})
    needs: version
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15
          - name: macos-x86_64
            runner: macos-15-intel
          - name: windows-x86_64
            runner: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install sqlload and sqlload-cli from PyPI
        shell: bash
        run: |
          python -m venv smoke
          python -m venv smoke-cli
          bin=smoke/bin; cli=smoke-cli/bin
          if [[ "${RUNNER_OS}" == "Windows" ]]; then bin=smoke/Scripts; cli=smoke-cli/Scripts; fi
          # PyPI's index pages can lag the JSON API for a few minutes.
          for attempt in $(seq 1 10); do
            "${bin}/python" -m pip install --quiet --no-cache-dir --only-binary :all: "sqlload==${VERSION}" &&
              "${cli}/python" -m pip install --quiet --no-cache-dir --only-binary :all: "sqlload-cli==${VERSION}" && break
            if [[ "$attempt" == 10 ]]; then exit 1; fi
            sleep 30
          done
          echo "BIN=${bin}" >> "$GITHUB_ENV"
          echo "CLI=${cli}" >> "$GITHUB_ENV"
      - name: Run the CLI, the import and a small load
        shell: bash
        run: |
          "${BIN}/sqlload" --help > /dev/null
          "${BIN}/python" -c "import sqlload, sqlload._native"
          "${BIN}/python" -I .github/scripts/smoke_published_wheel.py "${VERSION}" "${BIN}/sqlload" "${CLI}/sqlload" --lone-shim "${CLI}/sqll"
      - name: Check the ODBC driver manager
        shell: bash
        run: |
          # As in Publish: on Linux in a container with no unixODBC (the runner image has one), on
          # macOS once Homebrew's is removed, on Windows odbc32.dll.
          case "${RUNNER_OS}" in
            Linux)
              docker run --rm -e VERSION -v "$PWD:/w" -w /w python:3.12-slim bash -c '
                python -m venv /v && python -m venv /c &&
                for attempt in $(seq 1 10); do
                  /v/bin/pip install --quiet --no-cache-dir --only-binary :all: "sqlload==${VERSION}" &&
                    /c/bin/pip install --quiet --no-cache-dir --only-binary :all: "sqlload-cli==${VERSION}" && break
                  if [ "$attempt" = 10 ]; then exit 1; fi
                  sleep 30
                done &&
                /v/bin/python .github/scripts/smoke_odbc_wheel.py /v/bin/sqlload /c/bin/sqlload --default-ini /etc/odbcinst.ini --driver-folder "/usr/lib/$(uname -m)-linux-gnu/odbc"'
              ;;
            macOS)
              if brew list --versions unixodbc > /dev/null 2>&1; then brew uninstall --ignore-dependencies unixodbc; fi
              "${BIN}/python" .github/scripts/smoke_odbc_wheel.py "${BIN}/sqlload" "${CLI}/sqlload" --default-ini "$(brew --prefix)/etc/odbcinst.ini"
              ;;
            Windows)
              "${BIN}/python" .github/scripts/smoke_odbc_wheel.py "${BIN}/sqlload" "${CLI}/sqlload"
              ;;
          esac

  report:
    name: Report a failure
    needs: [version, smoke]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          title="Published wheel smoke test fails"
          number=$(gh issue list --state open --limit 500 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "It failed for ${VERSION:-an unresolved version}: $RUN_URL"
          else
            gh issue create --title "$title" --body "Installing ${VERSION:-the release} from PyPI failed a smoke check on at least one platform: $RUN_URL. The run's log names the platform and the check."
          fi
