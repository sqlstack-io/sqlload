name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Linux binary
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y libsasl2-dev
      - run: cargo build --release -p sqlload-cli --features ssl,sasl
      - run: |
          archive="sqlload-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "${archive}" -C target/release sqlload
          sha256sum "${archive}" > "${archive}.sha256"
          gh release upload "${TAG}" "${archive}" "${archive}.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
