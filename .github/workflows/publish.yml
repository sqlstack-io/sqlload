name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string
  # A pull request changing how wheels are built builds and smoke-tests them all, and publishes
  # nothing.
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - .github/scripts/assert_*_wheel_tags.sh
      - .github/scripts/interrupt_python_load.py
      - .github/scripts/build_unixodbc.sh
      - .github/scripts/unixodbc_source.sh
      - .github/scripts/assert_sdist_sources.sh
      - .github/scripts/assert_wheel_notices.sh
      - .github/scripts/smoke_odbc_wheel.py
      - .github/scripts/smoke_mysql_odbc_wheel.sh
      - packages/*/licenses/**
      - packages/*/pyproject.toml
      - Cargo.toml
      - Cargo.lock
      - crates/sqlload/Cargo.toml
      - crates/sqlload-python/Cargo.toml

# A new push to a pull request cancels its older wheel builds; a release run is a group of its own,
# so releases never cancel each other.
concurrency:
  group: publish-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      version: ${{ steps.release-tag.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release-tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "A pull request: building its head, publishing nothing."
            exit 0
          fi
          tag="${{ inputs.tag }}"

          if [[ ! "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish tag '$tag'. Expected exact v0.MINOR.PATCH semver."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  release-metadata:
    name: Validate release metadata
    needs: release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - name: Match package versions to release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          def project_version(path):
              with Path(path).open("rb") as file:
                  return tomllib.load(file)["project"]["version"]
          with Path("Cargo.toml").open("rb") as file:
              workspace_version = tomllib.load(file)["workspace"]["package"]["version"]
          manifests = [
              ("Python package", project_version("packages/sqlload/pyproject.toml")),
              ("CLI package", project_version("packages/sqlload-cli/pyproject.toml")),
              ("Cargo workspace", workspace_version),
          ]
          mismatches = [f"{label}={version}" for label, version in manifests if version != expected]
          if mismatches:
              raise SystemExit(
                  f"Release tag version {expected} does not match: {', '.join(mismatches)}"
              )
          PY

  # Each package's wheel builds in its own job, so the CLI and the extension build side by side.
  wheels:
    name: Build ${{ matrix.package.name }} (${{ matrix.platform.name }})
    needs: [release-tag, release-metadata]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          # homebrew: the Homebrew prefix of the Macs the wheel runs on, whose etc the bundled
          # unixODBC reads and whose lib it finds drivers in by name.
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
            homebrew: /opt/homebrew
          # Cross-compiled on Apple silicon, several times faster than GitHub's Intel runners;
          # wheel-smoke installs and runs it on an Intel Mac.
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64
            homebrew: /usr/local
            cross: x86_64-apple-darwin
            # librdkafka's own configure (rdkafka-sys) builds for the runner's architecture unless
            # its compiler and linker flags name the target's.
            arch_flags: -arch x86_64
        # builds: the packages the cell builds. sqlload-cli ships one standalone Rust executable
        # (OpenSSL built in) and links no libpython, so maturin tags it py3-none-<platform>. sqlload
        # is a PyO3 extension built against the stable ABI, so one cp310-abi3 wheel per platform
        # serves CPython 3.10 and later, and cross-compiles without a target Python.
        package:
          - name: CLI wheel
            id: cli
            builds: cli
          - name: Python extension wheel
            id: python
            builds: python
        # Windows builds both in one job: the second reuses the first's build and takes about two
        # minutes, where a job of its own builds everything again.
        include:
          - platform:
              name: windows-x86_64
              runner: windows-latest
              target: x86_64
            package:
              name: CLI and Python extension wheels
              id: both
              builds: cli python
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      # Vendored OpenSSL's Configure needs a native Windows Perl; Git Bash's lacks modules it loads.
      # Without nasm it builds with no-asm.
      - name: Use Strawberry Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV'
      # The arm64 wheel's floor already; the Intel one would otherwise get Rust's (10.12), older than
      # the C++ library DuckDB's bundled build needs.
      - name: Build for macOS 11 and newer
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      # unixODBC built from its pinned source, which the Linux and macOS wheels bundle as a separate
      # shared library (licenses/ in each package; Linux builds it in the manylinux container below).
      # The runner's Homebrew copy goes first, so the wheels link this one. It reads the target Macs'
      # Homebrew etc, where Homebrew's drivers register; the Intel one is cross-compiled for x86_64.
      - name: Build unixODBC for macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW: ${{ matrix.platform.homebrew }}
          UNIXODBC_HOST: ${{ matrix.platform.cross }}
        run: |
          if brew list --versions unixodbc > /dev/null 2>&1; then brew uninstall --ignore-dependencies unixodbc; fi
          if [[ -n "$UNIXODBC_HOST" ]]; then export CC="clang -arch ${UNIXODBC_HOST%%-*}"; fi
          bash .github/scripts/build_unixodbc.sh "$RUNNER_TEMP/unixodbc" "$HOMEBREW/etc" '' "$HOMEBREW/lib"
          echo "RUSTFLAGS=-L native=$RUNNER_TEMP/unixodbc/lib" >> "$GITHUB_ENV"
      # sccache keeps compiled crates and DuckDB's bundled C++ between runs of the same branch, so a
      # release build reuses the previous release's work and recompiles little beyond sqlload. Not on
      # Windows, where it made the build about 12 minutes slower. If the Actions cache is down when
      # sccache starts, the build fails; rerun it (PyPI skips wheels it already has).
      - name: Build CLI wheel
        if: contains(matrix.package.builds, 'cli')
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS: ${{ matrix.platform.arch_flags }}
          LDFLAGS: ${{ matrix.platform.arch_flags }}
        with:
          command: build
          # The wheels build ODBC (sdists don't, so building one needs no driver manager); repair copies
          # unixODBC into the Linux and macOS wheels; Windows uses odbc32.dll.
          args: --release --out ../../dist --features odbc ${{ runner.os != 'Windows' && '--auditwheel=repair' || '' }}
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
          sccache: ${{ runner.os != 'Windows' }}
          working-directory: packages/sqlload-cli
          # The vendored OpenSSL build runs Perl's Configure, which needs modules the
          # manylinux image leaves out. unixODBC reads /etc, where distribution drivers register.
          before-script-linux: |
            dnf install -y perl-IPC-Cmd perl-Time-Piece
            bash "$GITHUB_WORKSPACE/.github/scripts/build_unixodbc.sh" /usr /etc /usr/lib64 "/usr/lib/$(uname -m)-linux-gnu/odbc:/usr/lib/$(uname -m)-linux-gnu:/usr/lib64/odbc:/usr/lib64"
      - name: Build Python extension wheel
        if: contains(matrix.package.builds, 'python')
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS: ${{ matrix.platform.arch_flags }}
          LDFLAGS: ${{ matrix.platform.arch_flags }}
        with:
          command: build
          args: --release --out ../../dist --features odbc ${{ runner.os != 'Windows' && '--auditwheel=repair' || '' }}
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
          sccache: ${{ runner.os != 'Windows' }}
          working-directory: packages/sqlload
          before-script-linux: |
            dnf install -y perl-IPC-Cmd perl-Time-Piece
            bash "$GITHUB_WORKSPACE/.github/scripts/build_unixodbc.sh" /usr /etc /usr/lib64 "/usr/lib/$(uname -m)-linux-gnu/odbc:/usr/lib/$(uname -m)-linux-gnu:/usr/lib64/odbc:/usr/lib64"
      - name: Assert the CLI wheel's tag
        if: contains(matrix.package.builds, 'cli')
        shell: bash
        run: bash .github/scripts/assert_cli_wheel_tags.sh dist
      - name: Assert the Python extension wheel's tag
        if: contains(matrix.package.builds, 'python')
        shell: bash
        run: bash .github/scripts/assert_python_wheel_tags.sh dist
      - name: Assert the wheel carries unixODBC's notice, and a Linux or macOS wheel bundles it
        shell: bash
        run: bash .github/scripts/assert_wheel_notices.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.package.id }}
          path: dist

  # Each platform's two wheels, installed and run natively: the Intel Mac's on an Intel runner.
  wheel-smoke:
    name: Smoke-test wheels (${{ matrix.platform.name }})
    needs: [release-tag, wheels]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          # GitHub's last Intel macOS image, available until August 2027.
          - name: macos-x86_64
            runner: macos-15-intel
          - name: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          pattern: wheel-${{ matrix.platform.name }}-*
          path: dist
          merge-multiple: true
      - name: Smoke-test the wheels
        shell: bash
        run: |
          python -m venv smoke
          bin=smoke/bin
          if [[ "${RUNNER_OS}" == "Windows" ]]; then bin=smoke/Scripts; fi
          "${bin}/python" -m pip install --quiet dist/sqlload-*.whl
          "${bin}/sqlload" --help
          "${bin}/sqll" --help > /dev/null
          "${bin}/python" -c "import sqlload, sqlload._native"
          "${bin}/python" .github/scripts/interrupt_python_load.py
          python -m venv smoke-cli
          cli=smoke-cli/bin
          if [[ "${RUNNER_OS}" == "Windows" ]]; then cli=smoke-cli/Scripts; fi
          "${cli}/python" -m pip install --quiet dist/sqlload_cli-*.whl
          "${cli}/sqlload" --version
          "${cli}/sqll" --version
          # ODBC through each wheel's driver manager: on Linux in a container with no unixODBC (the
          # runner image has one), on macOS once Homebrew's is removed, on Windows odbc32.dll.
          case "${RUNNER_OS}" in
            Linux)
              docker run --rm -v "$PWD:/w" -w /w python:3.12-slim bash -c '
                python -m venv /v && /v/bin/pip install --quiet dist/sqlload-*.whl &&
                python -m venv /c && /c/bin/pip install --quiet dist/sqlload_cli-*.whl &&
                /v/bin/python .github/scripts/smoke_odbc_wheel.py /v/bin/sqlload /c/bin/sqlload --default-ini /etc/odbcinst.ini --driver-folder "/usr/lib/$(uname -m)-linux-gnu/odbc"'
              ;;
            macOS)
              if brew list --versions unixodbc > /dev/null 2>&1; then brew uninstall --ignore-dependencies unixodbc; fi
              "${bin}/python" .github/scripts/smoke_odbc_wheel.py "${bin}/sqlload" "${cli}/sqlload" --default-ini "$(brew --prefix)/etc/odbcinst.ini"
              ;;
            Windows)
              "${bin}/python" .github/scripts/smoke_odbc_wheel.py "${bin}/sqlload" "${cli}/sqlload"
              ;;
          esac
      # A live load from MySQL 8.4 through MySQL Connector/ODBC from MySQL's Debian 13 package, through
      # each wheel's bundled unixODBC; the package is built for amd64 alone.
      - name: Load through MySQL Connector/ODBC's Debian 13 package
        if: matrix.platform.name == 'linux-x86_64'
        run: bash .github/scripts/smoke_mysql_odbc_wheel.sh dist

  sdist:
    name: Build sdists
    needs: [release-tag, release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      # unixODBC's source, SHA-checked, into each package: the sdists carry it as the corresponding
      # source of the driver manager the Linux and macOS wheels bundle (LGPL-2.1 section 4).
      - name: Fetch unixODBC's source for the sdists
        run: bash .github/scripts/unixodbc_source.sh packages/sqlload packages/sqlload-cli
      - name: Build Python extension sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../../dist
          working-directory: packages/sqlload
      - name: Build native CLI sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../../dist
          working-directory: packages/sqlload-cli
      - name: Assert every sdist carries unixODBC's source, unchanged
        run: bash .github/scripts/assert_sdist_sources.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch'
    needs:
      - release-tag
      - wheels
      - wheel-smoke
      - sdist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Assert native CLI wheels are interpreter-agnostic
        shell: bash
        run: bash .github/scripts/assert_cli_wheel_tags.sh dist

      - name: Assert Python extension wheels target the stable ABI
        shell: bash
        run: bash .github/scripts/assert_python_wheel_tags.sh dist

      - name: Assert every wheel carries unixODBC's notice, and Linux and macOS wheels bundle it
        shell: bash
        run: bash .github/scripts/assert_wheel_notices.sh dist

      - name: Assert every sdist carries unixODBC's source, unchanged
        shell: bash
        run: bash .github/scripts/assert_sdist_sources.sh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  crates:
    name: Publish to crates.io
    if: github.event_name == 'workflow_dispatch'
    needs:
      - release-tag
      - wheels
      - wheel-smoke
      - sdist
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Exchange the OIDC token for a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish sqlload
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked -p sqlload
