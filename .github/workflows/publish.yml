name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string
  # A pull request changing how wheels are built builds and smoke-tests them all, and publishes
  # nothing.
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - .github/scripts/assert_*_wheel_tags.sh
      - packages/*/pyproject.toml
      - crates/sqlload/Cargo.toml
      - crates/sqlload-python/Cargo.toml

permissions:
  contents: read

jobs:
  release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      version: ${{ steps.release-tag.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release-tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "A pull request: building its head, publishing nothing."
            exit 0
          fi
          tag="${{ inputs.tag }}"

          if [[ ! "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish tag '$tag'. Expected exact v0.MINOR.PATCH semver."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  release-metadata:
    name: Validate release metadata
    needs: release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - name: Match package versions to release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          def project_version(path):
              with Path(path).open("rb") as file:
                  return tomllib.load(file)["project"]["version"]
          with Path("Cargo.toml").open("rb") as file:
              workspace_version = tomllib.load(file)["workspace"]["package"]["version"]
          manifests = [
              ("Python package", project_version("packages/sqlload/pyproject.toml")),
              ("CLI package", project_version("packages/sqlload-cli/pyproject.toml")),
              ("Cargo workspace", workspace_version),
          ]
          mismatches = [f"{label}={version}" for label, version in manifests if version != expected]
          if mismatches:
              raise SystemExit(
                  f"Release tag version {expected} does not match: {', '.join(mismatches)}"
              )
          PY

  wheels:
    name: Build wheel (${{ matrix.platform.name }})
    needs: [release-tag, release-metadata]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
          # GitHub's last Intel macOS image, available until August 2027.
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      # Vendored OpenSSL's Configure needs a native Windows Perl; Git Bash's lacks modules it loads.
      # Without nasm it builds with no-asm.
      - name: Use Strawberry Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV'
      # The arm64 wheel's floor already; the Intel one would otherwise get Rust's (10.12), older than
      # the C++ library DuckDB's bundled build needs.
      - name: Build for macOS 11 and newer
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      # sqlload-cli ships one standalone Rust executable (OpenSSL built in) and links no libpython,
      # so maturin tags it py3-none-<platform>. The tag is asserted before release.
      - name: Build native CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out ../../dist
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
          working-directory: packages/sqlload-cli
          # The vendored OpenSSL build runs Perl's Configure, which needs modules the
          # manylinux image leaves out.
          before-script-linux: dnf install -y perl-IPC-Cmd perl-Time-Piece
      - name: Assert native CLI wheel is interpreter-agnostic
        shell: bash
        run: bash .github/scripts/assert_cli_wheel_tags.sh dist
      # sqlload is a PyO3 extension built against the stable ABI, so one cp310-abi3 wheel per
      # platform serves CPython 3.10 and later.
      - name: Build Python extension wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out ../../dist
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
          working-directory: packages/sqlload
          before-script-linux: dnf install -y perl-IPC-Cmd perl-Time-Piece
      - name: Assert Python extension wheel targets the stable ABI
        shell: bash
        run: bash .github/scripts/assert_python_wheel_tags.sh dist
      - name: Smoke-test the wheels
        shell: bash
        run: |
          python -m venv smoke
          bin=smoke/bin
          if [[ "${RUNNER_OS}" == "Windows" ]]; then bin=smoke/Scripts; fi
          "${bin}/python" -m pip install --quiet dist/sqlload-*.whl
          "${bin}/sqlload" --help
          "${bin}/python" -c "import sqlload, sqlload._native"
          python -m venv smoke-cli
          cli=smoke-cli/bin
          if [[ "${RUNNER_OS}" == "Windows" ]]; then cli=smoke-cli/Scripts; fi
          "${cli}/python" -m pip install --quiet dist/sqlload_cli-*.whl
          "${cli}/sqlload" --version
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Build sdists
    needs: [release-tag, release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Build Python extension sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../../dist
          working-directory: packages/sqlload
      - name: Build native CLI sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../../dist
          working-directory: packages/sqlload-cli
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch'
    needs:
      - release-tag
      - wheels
      - sdist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Assert native CLI wheels are interpreter-agnostic
        shell: bash
        run: bash .github/scripts/assert_cli_wheel_tags.sh dist

      - name: Assert Python extension wheels target the stable ABI
        shell: bash
        run: bash .github/scripts/assert_python_wheel_tags.sh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  crates:
    name: Publish to crates.io
    if: github.event_name == 'workflow_dispatch'
    needs:
      - release-tag
      - wheels
      - sdist
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Exchange the OIDC token for a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish sqlload
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked -p sqlload
