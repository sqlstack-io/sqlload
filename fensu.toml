[targets.rust]
analyzer = "rust"
roots = ["crates"]
tests = []
tooling = ["crates/sqlload-testkit"]
rule_packs = ["rust"]
select = ["FPRS"]

[[targets.rust.rule_exceptions]]
rule = "FPRSS201"
path = "crates/sqlload/src/auth/models.rs"
symbols = ["Secret"]
reason = "Secret wraps credentials and implements Debug by hand so tokens, keys and passwords never reach logs; a derived Debug would print them."


[[targets.rust.rule_exceptions]]
rule = "FPRSL105"
path = "crates/sqlload-testkit/src/configs/main/streaming_config.rs"
reason = "Testkit entry used by sqlload's integration tests, which live outside the analysed crate tree."

