rule = "FPRSH003"
path = "crates/sqlload-python/src/crossing/_helpers/parser.rs"
symbols = ["panic_if"]
reason = "The crossing's test hook panics on purpose, to prove a panicking crossing thread fails the read instead of ending it early."

