[targets.rust]
analyzer = "rust"
roots = ["crates"]
tests = []
tooling = ["crates/sqlload-testkit"]
rule_packs = ["rust"]
rule_paths = ["fensu_rules/adapter_ownership.py", "fensu_rules/loader_reads.py"]
select = ["FPRS", "XSL"]

[[targets.rust.rule_exceptions]]
rule = "FPRSS201"
path = "crates/sqlload/src/auth/models.rs"
symbols = ["Secret"]
reason = "Secret wraps credentials and implements Debug by hand so tokens, keys and passwords never reach logs; a derived Debug would print them."

[[targets.rust.rule_exceptions]]
rule = "FPRSS201"
path = "crates/sqlload/src/ssh_tunnel/models.rs"
symbols = ["TunnelStream"]
reason = "TunnelStream wraps russh's channel stream and session handle, which implement no Debug; it implements Debug by hand, showing its route."


