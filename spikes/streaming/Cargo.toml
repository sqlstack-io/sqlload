[package]
name = "spike-streaming"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike: Snowpipe Streaming high-performance REST API (Named Channels) without an SDK"

[[bin]]
name = "spike-streaming"
path = "src/main.rs"

[dependencies]
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
tower-layer = "0.3"
tower-service = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
debug = false
