[package]
name = "spike-internal-stage"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike: upload to a Snowflake internal stage without an official driver, reusing connections"

[[bin]]
name = "spike-internal-stage"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-layer = "0.3"
tower-service = "0.3"
