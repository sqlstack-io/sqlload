[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sqlload-api"
version = "0.89.1" # x-release-please-version
description = "SQLLoad's Python API for describing data and HTTP requests, without the engine."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sqlstack-io/sqlload"
Issues = "https://github.com/sqlstack-io/sqlload/issues"
Repository = "https://github.com/sqlstack-io/sqlload"

[tool.hatch.build.targets.wheel]
packages = ["python/sqlload_api"]

[tool.hatch.build.targets.sdist]
include = ["python/sqlload_api", "tests", "README.md", "LICENSE"]
