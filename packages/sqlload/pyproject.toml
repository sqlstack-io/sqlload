[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sqlload"
version = "0.45.0" # x-release-please-version
description = "SQL data loading tooling."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database",
]
# orjson writes gathered dict rows as JSON bytes, which Rust parses without the GIL.
dependencies = ["orjson>=3.10"]

[project.optional-dependencies]
# MotherDuck targets: MotherDuck accepts DuckDB 1.4.1 to 1.5.6 (raise the bound as MotherDuck does), not the DuckDB
# 2.0 SQLLoad bundles, so SQLLoad runs their SQL on this package in a separate Python process. Remove once MotherDuck
# accepts SQLLoad's DuckDB.
motherduck = ["duckdb>=1.4.1,<=1.5.6"]

[project.scripts]
sqlload = "sqlload._cli:main"

[project.urls]
Homepage = "https://github.com/sqlstack-io/sqlload"
Issues = "https://github.com/sqlstack-io/sqlload/issues"
Repository = "https://github.com/sqlstack-io/sqlload"

[tool.maturin]
manifest-path = "../../crates/sqlload-python/Cargo.toml"
module-name = "sqlload._native"
python-source = "python"
# Kafka TLS with OpenSSL built in, as in sqlload-cli; SASL PLAIN and SCRAM need nothing else.
# The published wheels also build `odbc` (publish.yml's --features odbc), bundling unixODBC on Linux
# and macOS (licenses/); a build from this sdist leaves it out, so it needs no driver manager.
features = ["ssl-vendored"]
# unixODBC's source, which the release sdist carries as the corresponding source of the library the
# Linux and macOS wheels bundle; publish.yml fetches it (unixodbc_source.sh) and checks it is there.
include = [{ path = "unixODBC-*.tar.gz", format = "sdist" }]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "python/**/*.py" },
  { file = "../../Cargo.toml" },
  { file = "../../Cargo.lock" },
  { file = "../../crates/*/Cargo.toml" },
  { file = "../../crates/*/src/**/*.rs" },
]
