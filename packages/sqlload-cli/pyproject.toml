[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sqlload-cli"
version = "0.36.0" # x-release-please-version
description = "Native executable for sqlload."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["licenses/*"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/sqlstack-io/sqlload"
Issues = "https://github.com/sqlstack-io/sqlload/issues"
Repository = "https://github.com/sqlstack-io/sqlload"

[tool.maturin]
bindings = "bin"
manifest-path = "../../crates/sqlload/Cargo.toml"
# Kafka TLS with OpenSSL built in; SASL PLAIN and SCRAM need nothing else. GSSAPI is left out.
# The published wheels also build `odbc` (publish.yml's --features odbc), bundling unixODBC on Linux
# and macOS (licenses/); a build from this sdist leaves it out, so it needs no driver manager.
features = ["ssl-vendored"]
# unixODBC's source, which the release sdist carries as the corresponding source of the library the
# Linux and macOS wheels bundle; publish.yml fetches it (unixodbc_source.sh) and checks it is there.
include = [{ path = "unixODBC-*.tar.gz", format = "sdist" }]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../../Cargo.toml" },
  { file = "../../Cargo.lock" },
  { file = "../../crates/*/Cargo.toml" },
  { file = "../../crates/*/src/**/*.rs" },
]
